<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Catatan Keuangan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--bd:#e3e6ea;--rd:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2328;--tx:#eceff3;--mu:#9aa3ad;--ac:#2dd4bf;--bd:#2f363d;--rd:#f87171}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.x{background:none;color:var(--rd);padding:4px 8px}
.row{display:flex;gap:8px}.row>*{flex:1}
#st{font-size:13px;color:var(--mu);margin-top:8px;min-height:18px}
.big{font-size:26px;font-weight:700}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}.it .m{flex:1;min-width:0}.it .m small{color:var(--mu);display:block}
.sm{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
</style>
</head>
<body>
<main>
<h1>🧾 Catatan Keuangan</h1>
<div class="card">
  <label for="kam">Foto struk (dibaca otomatis)</label>
  <div class="row"><button type="button" id="kam">Buka kamera</button><button type="button" class="sec" id="gal">Pilih dari galeri</button></div>
  <div id="kmr" hidden style="margin-top:10px">
    <video id="vid" playsinline muted autoplay style="width:100%;border-radius:8px;background:#000"></video>
    <div class="row" style="margin-top:8px"><button type="button" id="jepret">Ambil foto</button><button type="button" class="sec" id="tutup">Batal</button></div>
  </div>
  <input id="foto" type="file" accept="image/*" capture="environment" hidden>
  <input id="foto2" type="file" accept="image/*" hidden>
  <div id="st0" style="font-size:13px;color:var(--mu);margin-top:6px">Foto yang terang dan lurus paling akurat. Hasil bacaan mengisi kolom di bawah, periksa dulu sebelum menyimpan.</div>
  <label for="tgl">Tanggal</label><input id="tgl" type="date">
  <label for="toko">Toko / keterangan</label><input id="toko" type="text" placeholder="Contoh: Indomaret">
  <div class="row">
    <div><label for="kat">Kategori</label><select id="kat"></select></div>
    <div><label for="tot">Total (Rp)</label><input id="tot" type="number" inputmode="numeric" min="0"></div>
  </div>
  <p><button id="simpan" style="width:100%">Simpan</button></p>
  <div id="st"></div>
</div>
<div class="card">
  <div style="color:var(--mu);font-size:13px">Pengeluaran bulan ini</div>
  <div class="big" id="bln">Rp 0</div>
  <div id="sum" style="margin-top:8px"></div>
</div>
<div class="card">
  <div class="row" style="align-items:center;margin-bottom:6px">
    <strong>Riwayat</strong>
    <button class="sec" id="xl">Unduh Excel</button>
  </div>
  <div id="list"></div>
</div>
<p style="text-align:center;font-size:12px;color:var(--mu)">Versi 5</p>
</main>
<script>
const KAT=['Makan','Belanja','Transport','Tagihan','Kesehatan','Lainnya'];
const $=id=>document.getElementById(id);
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const hari=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let rows=[];
try{rows=JSON.parse(localStorage.getItem('keuangan')||'[]')}catch(e){}
const simpanLokal=()=>{try{localStorage.setItem('keuangan',JSON.stringify(rows))}catch(e){}};
$('kat').innerHTML=KAT.map(k=>'<option>'+k+'</option>').join('');
$('tgl').value=hari();


try{localStorage.removeItem('keuangan_kunci')}catch(e){}
let ocr=null;
const POLA=/\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|\d+/g;
const KATA={Transport:/pertamina|shell|spbu|bensin|pertalite|pertamax|parkir|\btol\b|grab|gojek|bluebird|krl/i,Kesehatan:/apotek|apotik|farmasi|klinik|kimia farma|k-?24|guardian|rumah sakit|dokter/i,Tagihan:/\bpln\b|listrik|pdam|telkom|indihome|pulsa|token|bpjs|internet/i,Makan:/resto|cafe|kopi|warung|bakso|ayam|bakery|roti|pizza|burger|kfc|mcd|starbucks|nasi|sate/i,Belanja:/indomaret|indomarco|alfamart|alfamidi|alfaria|supermarket|mart\b|toko|swalayan|hypermart|lotte|giant|mall/i};
const angka=m=>{let t=m;if(/[.,]\d{2}$/.test(t))t=t.replace(/[.,]\d{2}$/,'');return Number(t.replace(/[.,]/g,''))};
function cariTotal(b){
  const kunci=/total|jumlah|tagihan|grand|bayar|belanja/i,buang=/sub\s*total|kembali|change|tunai|cash|diskon|disc|hemat|ppn|pajak|tax/i;
  let best=0;
  b.forEach((l,i)=>{
    if(!kunci.test(l)||buang.test(l))return;
    let n=(l.match(POLA)||[]).map(angka).filter(v=>v>=100);
    if(!n.length&&b[i+1]&&!buang.test(b[i+1]))n=(b[i+1].match(POLA)||[]).map(angka).filter(v=>v>=100);
    n.forEach(v=>{if(v>best&&v<1e9)best=v});
  });
  return best;
}
function cariTanggal(t){
  const ok=(d,mo,y)=>{y=+y;if(y<100)y+=2000;d=+d;mo=+mo;return y>=2000&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=31?y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'):''};
  let m,r;
  const a=/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/g;
  while((m=a.exec(t))){r=ok(m[3],m[2],m[1]);if(r)return r}
  const b=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g;
  while((m=b.exec(t))){r=ok(m[1],m[2],m[3]);if(r)return r}
  return '';
}
function cariToko(b){
  for(const l of b.slice(0,6)){
    const s=l.replace(/[^A-Za-z0-9 &.'-]/g,' ').replace(/\s+/g,' ').trim();
    if((s.match(/[A-Za-z]/g)||[]).length>=3&&!/^(struk|nota|invoice|kasir|tanggal)/i.test(s))return s.slice(0,40);
  }
  return '';
}
function cariKat(t){for(const k in KATA)if(KATA[k].test(t))return k;return 'Lainnya'}
function muatTesseract(){return new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('muat'));document.head.append(s)})}
function siapkan(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');try{x.filter='grayscale(1) contrast(1.4)'}catch(e){}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c)};im.onerror=()=>no(new Error('gambar'));im.src=u})}

async function baca(f){
  const st=$('st0');
  try{
    st.textContent='Menyiapkan foto...';
    const c=await siapkan(f);
    if(!ocr){
      if(!navigator.onLine&&!window.Tesseract){st.textContent='Pertama kali, pembaca foto butuh internet. Isi manual atau coba lagi saat online.';return}
      st.textContent='Memuat pembaca teks (lama hanya di awal)...';
      await muatTesseract();
      ocr=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')st.textContent='Membaca struk '+Math.round(m.progress*100)+'%'}});
    }
    st.textContent='Membaca struk...';
    const r=await ocr.recognize(c);
    const teks=(r.data&&r.data.text)||'';
    const b=teks.split('\n').map(s=>s.trim()).filter(Boolean);
    const total=cariTotal(b),tgl=cariTanggal(teks),toko=cariToko(b);
    if(toko)$('toko').value=toko;
    if(tgl)$('tgl').value=tgl;
    if(total)$('tot').value=total;
    $('kat').value=cariKat(b.slice(0,8).join(' '));
    const kurang=[!total&&'total',!tgl&&'tanggal',!toko&&'toko'].filter(Boolean);
    st.textContent=kurang.length?'Terbaca sebagian. Isi manual: '+kurang.join(', ')+'.':'Selesai dibaca. Periksa dulu, lalu tekan Simpan.';
  }catch(err){st.textContent='Gagal membaca struk. Pastikan internet aktif saat pertama kali, atau isi manual.'}
}
[$('foto'),$('foto2')].forEach(i=>i.addEventListener('change',()=>{const f=i.files[0];if(f)baca(f)}));
let strm=null;
function matikanKamera(){if(strm){strm.getTracks().forEach(t=>t.stop());strm=null}$('vid').srcObject=null;$('kmr').hidden=true}
$('kam').onclick=async()=>{
  const st=$('st0');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('foto').click();return}
  try{
    strm=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    $('vid').srcObject=strm;$('kmr').hidden=false;
    try{await $('vid').play()}catch(e){}
    st.textContent='Arahkan kamera ke struk, lalu tekan Ambil foto.';
  }catch(e){
    st.textContent='Kamera belum diizinkan. Izinkan kamera lewat pengaturan situs di Chrome, atau pakai Pilih dari galeri.';
  }
};
$('jepret').onclick=()=>{
  const v=$('vid');if(!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>{matikanKamera();if(b)baca(b)},'image/jpeg',.92);
};
$('tutup').onclick=()=>{matikanKamera();$('st0').textContent='Kamera ditutup.'};
document.addEventListener('visibilitychange',()=>{if(document.hidden)matikanKamera()});
$('gal').onclick=()=>$('foto2').click();

$('simpan').onclick=()=>{
  const total=Number($('tot').value);
  if(!total||total<=0){$('st').textContent='Isi total pengeluaran dulu.';return}
  rows.push({id:Date.now(),tgl:$('tgl').value||hari(),toko:$('toko').value.trim()||'-',kat:$('kat').value,total});
  simpanLokal();
  $('toko').value='';$('tot').value='';$('foto').value='';$('foto2').value='';$('tgl').value=hari();
  $('st').textContent='Tersimpan.';render();
};

function render(){
  const bulan=hari().slice(0,7);
  const ini=rows.filter(r=>r.tgl.slice(0,7)===bulan);
  $('bln').textContent=rp(ini.reduce((a,r)=>a+r.total,0));
  const per={};ini.forEach(r=>per[r.kat]=(per[r.kat]||0)+r.total);
  $('sum').innerHTML=Object.entries(per).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="sm"><span>'+k+'</span><span>'+rp(v)+'</span></div>').join('')||'<div style="color:var(--mu)">Belum ada catatan bulan ini.</div>';
  const L=$('list');L.textContent='';
  [...rows].sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id).forEach(r=>{
    const d=document.createElement('div');d.className='it';
    const m=document.createElement('div');m.className='m';
    const t=document.createElement('div');t.textContent=r.toko+' · '+rp(r.total);
    const s=document.createElement('small');s.textContent=r.tgl+' · '+r.kat;
    m.append(t,s);
    const x=document.createElement('button');x.className='x';x.textContent='Hapus';
    x.onclick=()=>{rows=rows.filter(q=>q.id!==r.id);simpanLokal();render()};
    d.append(m,x);L.append(d);
  });
  if(!rows.length)L.innerHTML='<div style="color:var(--mu)">Belum ada riwayat.</div>';
}

function unduh(blob,nama){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nama;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('xl').onclick=()=>{
  if(!rows.length){$('st').textContent='Belum ada data untuk diunduh.';return}
  const data=[...rows].sort((a,b)=>a.tgl.localeCompare(b.tgl));
  if(window.XLSX){
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Tanggal','Toko','Kategori','Total (Rp)'],...data.map(r=>[r.tgl,r.toko,r.kat,r.total])]),'Catatan');
    const per={};data.forEach(r=>{const k=r.tgl.slice(0,7)+'|'+r.kat;per[k]=(per[k]||0)+r.total});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Bulan','Kategori','Total (Rp)'],...Object.entries(per).sort().map(([k,v])=>[...k.split('|'),v])]),'Ringkasan');
    unduh(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}),'catatan-keuangan.xlsx');
  }else{
    const csv='Tanggal,Toko,Kategori,Total\n'+data.map(r=>[r.tgl,'"'+r.toko.replace(/"/g,'""')+'"',r.kat,r.total].join(',')).join('\n');
    unduh(new Blob([csv],{type:'text/csv'}),'catatan-keuangan.csv');
    $('st').textContent='Pustaka Excel belum termuat, file diunduh sebagai CSV (bisa dibuka di Excel).';
  }
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
